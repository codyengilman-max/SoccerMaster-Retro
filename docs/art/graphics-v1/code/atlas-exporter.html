<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoccerMaster sprite export</title><style>body{background:#142c3c;color:#fff0d3;font:16px system-ui;padding:24px;max-width:1000px;margin:auto}label{display:inline-flex;gap:8px;margin:10px}button,select{font:inherit;min-height:44px;padding:8px;background:#eee3cb;color:#142c3c;border:0}canvas{display:block;max-width:100%;image-rendering:pixelated;background:#51865c;border:1px solid #a7b891}a{color:#ffb77b}p{max-width:700px;line-height:1.5}</style><h1>Sprite export</h1><p>One cosmetic appearance, 80 frames. This exports rendering only. Existing game physics and controls remain authoritative. Serve this folder over localhost; the module does not load reliably from file://.</p><label>Kit <select id="team"><option value="0">Orange</option><option value="1">Navy</option><option value="2">Keeper</option></select></label><label>Hair <select id="style"></select></label><label>Color <select id="color"></select></label><label><input id="girl" type="checkbox"> Approved girl (blonde ponytail)</label><p><button id="png">Save PNG</button> <button id="json">Save frame map</button> <a href="../ART_REVIEW.html">Art gallery</a></p><p id="status" role="status">Loading renderer…</p><canvas id="sheet" width="768" height="960" aria-label="Generated gameplay animation frame sheet"></canvas><script type="module">
import {sprite,HAIR_STYLES,HAIR_COLORS,SPRITE_FRAME} from './sprite-factory.mjs';
const $=x=>document.getElementById(x),c=$('sheet'),g=c.getContext('2d');let map;
for(const [i,n] of HAIR_STYLES.entries()){$('style').add(new Option(n,String(i)))}for(const [i,n] of HAIR_COLORS.entries()){$('color').add(new Option(n,String(i)))}
function render(){g.clearRect(0,0,c.width,c.height);const config={team:Number($('team').value),hairStyle:Number($('style').value),hairIndex:Number($('color').value),girl:$('girl').checked};map={schemaVersion:1,format:'soccermaster-grid-reference',frameSize:[96,96],columns:8,rows:10,anchor:[48,68],appearance:config,frames:[]};let idx=0;for(const kind of ['run','idle','kick','slide','dive'])for(let dir=0;dir<8;dir++)for(let frame=0;frame<(kind==='run'?6:1);frame++){const x=(idx%8)*96,y=Math.floor(idx/8)*96;g.drawImage(sprite(config.team,dir,frame,kind,config.girl,config.hairIndex,config.hairStyle),x,y);map.frames.push({index:idx++,kind,dir,pose:frame,x,y,width:96,height:96});}$('status').textContent='80 frames ready. JSON is this package’s grid map; adapt it to your actual loader.';}
function save(blob,ext){if(!blob){$('status').textContent='Export failed';return}const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='soccermaster-sprite.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
for(const id of ['team','style','color','girl'])$(id).onchange=render;$('png').onclick=()=>c.toBlob(b=>save(b,'png'),'image/png');$('json').onclick=()=>save(new Blob([JSON.stringify(map,null,2)],{type:'application/json'}),'json');render();
</script></html>
