ach</text><rect x="560" y="285" width="490" height="370" rx="18" fill="#fffaf0" stroke="#d3bd91" stroke-width="2"/><circle cx="590" cy="319" r="19" fill="#f2a83b"/><text x="584" y="327" font-size="23" font-weight="bold">2</text><text x="620" y="327" font-size="25" font-weight="bold">Prepare turn</text><rect x="595" y="353" width="420" height="220" rx="12" fill="#e8edcd"/><text x="613" y="380" font-size="15" fill="#52613c">TOP VIEW • START FACING ↑</text><circle cx="765.0" cy="455.0" r="15" fill="#fff" stroke="#172642" stroke-width="3"/><path d="M 760.0 449.0 L 770.0 449.0 L 773.0 458.0 L 765.0 463.0 L 757.0 458.0 Z" fill="#172642"/><text x="588" y="606" font-size="23" font-weight="bold">L inside</text><text x="588" y="636" font-size="20">Inside edge ready</text><rect x="50" y="675" width="490" height="370" rx="18" fill="#fffaf0" stroke="#d3bd91" stroke-width="2"/><circle cx="80" cy="709" r="19" fill="#f2a83b"/><text x="74" y="717" font-size="23" font-weight="bold">3</text><text x="110" y="717" font-size="25" font-weight="bold">Redirect</text><rect x="85" y="743" width="420" height="220" rx="12" fill="#e8edcd"/><text x="103" y="770" font-size="15" fill="#52613c">TOP VIEW • START FACING ↑</text><circle cx="255.0" cy="845.0" r="15" fill="none" stroke="#7e896b" stroke-width="2" stroke-dasharray="4 4"/><path d="M 255.0 845.0 L 367.0 879.0" stroke="#b55b00" stroke-width="5" fill="none" marker-end="url(#arrow)"/><circle cx="367.0" cy="879.0" r="15" fill="#fff" stroke="#172642" stroke-width="3"/><path d="M 362.0 873.0 L 372.0 873.0 L 375.0 882.0 L 367.0 887.0 L 359.0 882.0 Z" fill="#172642"/><text x="78" y="996" font-size="23" font-weight="bold">L inside</text><text x="78" y="1026" font-size="20">New route shown</text><rect x="560" y="675" width="490" height="370" rx="18" fill="#fffaf0" stroke="#d3bd91" stroke-width="2"/><circle cx="590" cy="709" r="19" fill="#f2a83b"/><text x="584" y="717" font-size="23" font-weight="bold">4</text><text x="620" y="717" font-size="25" font-weight="bold">Follow</text><rect x="595" y="743" width="420" height="220" rx="12" fill="#e8edcd"/><text x="613" y="770" font-size="15" fill="#52613c">TOP VIEW • START FACING ↑</text><circle cx="877.0" cy="879.0" r="15" fill="#fff" stroke="#172642" stroke-width="3"/><path d="M 872.0 873.0 L 882.0 873.0 L 885.0 882.0 L 877.0 887.0 L 869.0 882.0 Z" fill="#172642"/><text x="588" y="996" font-size="23" font-weight="bold">No specified contact</text><text x="588" y="1026" font-size="20">Turn the body to follow</text><rect x="50" y="1080" width="1000" height="130" rx="14" fill="#172642"/><text x="73" y="1116" fill="#f2b342" font-size="22" font-weight="bold">COACH / ANIMATOR CHECK</text><text x="73" y="1147" font-size="18" fill="#fff5dc">Exit angle is illustrative, not a prescribed angle. Verify support-foot rotation and body</text><text x="73" y="1173" font-size="18" fill="#fff5dc">orientation with the coach.</text><text x="52" y="1243" font-size="18">R/L = player’s feet • Solid ball = end • Dashed ball = start • Arrow = ball route</text><text x="52" y="1274" font-size="18">Coordinates are illustrative. No fixed foot anchors, timing or human poses are implied.</text><text x="52" y="1305" font-size="18">Sources: D4, D8 • Text/index research only • Original design, not licensed Coerver media</text></g></svg>